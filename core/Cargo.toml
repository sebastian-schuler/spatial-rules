[package]
name = "spatial-rules-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust spatial rules/query engine core"

[dependencies]
geo.workspace = true
geojson.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"

[features]
default = []
# Expose the benchmark-ladder construction seams (alternative spatial indices,
# Ruleset::build_with, and the rules()/prepared() rule-source accessors) so the
# benchmark crate can swap index implementations. This is opt-in: ordinary
# consumers of spatial-rules-core get the single Ruleset::build boundary, and
# the benchmark crate plus core's own index-parity tests enable it explicitly.
benchmark = []
