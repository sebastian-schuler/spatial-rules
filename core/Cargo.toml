[package]
name = "spatial-rules-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust spatial rules/query engine core"

[dependencies]
geo.workspace = true
geojson.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"

[features]
default = ["benchmark"]
# Expose the benchmark-ladder construction seams (alternative spatial indices,
# Ruleset::build_with, and the rules()/prepared() rule-source accessors) so the
# benchmark crate and core's own integration tests can swap index
# implementations. The production bindings depend on core with
# `default-features = false`, so their API stays the single Ruleset::build
# boundary.
benchmark = []
