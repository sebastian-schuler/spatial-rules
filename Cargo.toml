[workspace]
resolver = "2"
members = ["core", "node", "benchmarks", "wasm", "python", "bindings-common"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
geo = { version = "0.33", features = ["serde"] }
geojson = "1.0"
pyo3 = { version = "0.23", features = ["abi3-py39"] }
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# Broad, cross-crate speedup for the compute-bound query path (perf-memory 01).
# `panic = "abort"` is deliberately NOT set: napi/PyO3 cross the FFI boundary.
[profile.release]
lto = "thin"
codegen-units = 1
