[workspace]
resolver = "2"
members = ["core", "node", "benchmarks"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
geo = { version = "0.33", features = ["serde"] }
geojson = "1.0"
rstar = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
