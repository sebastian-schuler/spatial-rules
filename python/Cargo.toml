[package]
name = "spatial-rules-python"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python distribution of the spatial rules engine core"

[lib]
name = "spatial_rules_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
serde_json.workspace = true
spatial-rules-bindings-common = { path = "../bindings-common" }
spatial-rules-core = { path = "../core" }