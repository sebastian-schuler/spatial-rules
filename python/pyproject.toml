[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "spatial-rules"
dynamic = ["version"]
description = "High-performance spatial rules/query engine (Rust core)"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[tool.maturin]
module-name = "spatial_rules"

[project.optional-dependencies]
dev = ["shapely>=2.0", "numpy"]