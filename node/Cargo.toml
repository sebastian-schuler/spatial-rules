[package]
name = "spatial-rules-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node-API (napi-rs) binding for the spatial rules core"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = { version = "3", default-features = false }
serde_json.workspace = true
spatial-rules-core = { path = "../core" }
spatial-rules-bindings-common = { path = "../bindings-common" }

[build-dependencies]
napi-build = "2"
