name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The python crate is a workspace member; its abi3 cdylib needs no
      # interpreter to compile, so skip pyo3's interpreter detection.
      PYO3_NO_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit + integration tests (includes proptest)
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build addon (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p spatial-rules-node
          cp target/release/libspatial_rules_node.so node/spatial_rules.node
      - name: Build addon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p spatial-rules-node
          Copy-Item target\release\spatial_rules_node.dll node\spatial_rules.node -Force
      - name: Install dev dependencies
        working-directory: node
        run: npm install
      - name: Typecheck (tsc --noEmit)
        working-directory: node
        run: npm run typecheck
      # Type stripping: default-on from Node 23.6; --experimental-strip-types is
      # accepted across the whole 22.6+/24/26 matrix, so pin it everywhere.
      - name: Smoke test (Node)
        working-directory: node
        run: node --experimental-strip-types test/smoke.ts

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build addon
        run: |
          cargo build --release -p spatial-rules-node
          cp target/release/libspatial_rules_node.so node/spatial_rules.node
      - name: Smoke test (Bun)
        working-directory: node
        run: bun test/smoke.ts

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: taiki-e/install-action@wasm-pack
      - name: Build wasm package
        working-directory: wasm
        run: wasm-pack build --release --target bundler --out-dir pkg
      - name: Install dev dependencies
        working-directory: wasm
        run: npm install
      - name: Typecheck (tsc --noEmit)
        working-directory: wasm
        run: npm run typecheck
      - name: Smoke test (Node)
        working-directory: wasm
        run: node --experimental-strip-types --experimental-wasm-modules test/smoke.ts
      - name: Smoke test (Deno)
        working-directory: wasm
        run: deno run --allow-read test/smoke.ts

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: python
      - name: Install wheel + pytest
        working-directory: python
        run: |
          pip install --force-reinstall dist/spatial_rules-*.whl
          pip install pytest
      - name: Smoke test (pytest)
        working-directory: python
        run: python -m pytest tests -q

  clean-install:
    # Zero-toolchain install path (ticket 18 / ticket 07): install the packed
    # root + platform tarballs into a fresh dir and run the install smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build addon into the platform package
        run: |
          cargo build --release -p spatial-rules-node
          mkdir -p node/npm/linux-x64-gnu
          cp target/release/libspatial_rules_node.so node/npm/linux-x64-gnu/spatial-rules.linux-x64-gnu.node
      - name: Install dev dependencies
        # `npm pack` runs the `prepack` tsc emit, which needs typescript.
        working-directory: node
        run: npm install
      - name: Pack root + platform tarballs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/root /tmp/platform
          (cd node && npm pack --pack-destination /tmp/root)
          (cd node/npm/linux-x64-gnu && npm pack --pack-destination /tmp/platform)
      - name: Install and run clean-install smoke
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ci-clean-install
          cd /tmp/ci-clean-install
          npm init -y >/dev/null
          # A .ts entry file is ESM only when the nearest package.json says so
          # (the old .mjs was implicitly ESM).
          npm pkg set type=module
          npm install /tmp/root/*.tgz /tmp/platform/*.tgz >/dev/null
          cp "$GITHUB_WORKSPACE/node/test/clean-install.ts" .
          node --experimental-strip-types clean-install.ts
