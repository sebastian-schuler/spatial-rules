name: prebuild-and-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            zig: false
            musl: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            zig: true
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            zig: true
            musl: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            zig: true
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            zig: false
            musl: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            zig: false
            musl: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zig (for cross-compile)
        if: matrix.zig
        uses: mlugg/setup-zig@v1
      - name: Install dependencies
        working-directory: node
        run: npm install
      - name: Build addon
        shell: bash
        working-directory: node
        run: |
          ZIG=""
          [ "${{ matrix.zig }}" = "true" ] && ZIG="--zig"
          RUSTFLAGS=""
          # musl cdylib needs a dynamic crt (napi-rs FAQ); glibc builds must not.
          [ "${{ matrix.musl }}" = "true" ] && RUSTFLAGS="-C target-feature=-crt-static"
          RUSTFLAGS="$RUSTFLAGS" npx napi build --target ${{ matrix.target }} --release $ZIG
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: node/npm/${{ matrix.platform }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev dependencies
        # Needed so the root package's prepack (tsc emit to dist/) works during
        # npm publish.
        working-directory: node
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Restore platform binaries
        run: |
          for dir in artifacts/*/; do
            platform="$(basename "$dir")"
            mkdir -p "node/npm/$platform"
            cp "$dir"/*.node "node/npm/$platform/"
          done
      - name: Publish platform packages
        working-directory: node/npm
        run: |
          for dir in */; do
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        working-directory: node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
