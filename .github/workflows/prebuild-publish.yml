name: prebuild-and-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: node
        run: npm install
      - name: Build all platform addons
        working-directory: node
        # napi build --platform cross-compiles every configured triple via zig
        # (x86_64/aarch64, linux gnu/musl, windows msvc) and stages each .node
        # into node/npm/<platform>/. This replaces the hand-rolled cargo/cross
        # matrix, which failed to build cdylibs for the musl targets and lacked
        # an aarch64 cross-linker on the x86_64 host.
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: platforms
          path: node/npm

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev dependencies
        # Needed so the root package's prepack (tsc emit to dist/) works during
        # npm publish.
        working-directory: node
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: platforms
          path: node/npm
      - name: Publish platform packages
        working-directory: node/npm
        run: |
          for dir in */; do
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        working-directory: node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
