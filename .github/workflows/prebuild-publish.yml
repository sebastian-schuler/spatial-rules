name: prebuild-and-publish

on:
  # release-please creates tags via the GitHub API, which fires a `release`
  # event rather than a `push` event — listen for both so a release PR merge
  # auto-publishes (the publish job guards on refs/tags/v).
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            musl: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            musl: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            musl: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            musl: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild (musl)
        if: matrix.musl
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
      - name: Install aarch64 glibc cross-gcc
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build addon
        shell: bash
        working-directory: node
        run: |
          set -euxo pipefail
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              # zig rejects rustc's --fix-cortex-a53-843419; use a real glibc
              # cross-gcc, which supports it.
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                cargo build --release --target ${{ matrix.target }} -p spatial-rules-node
              ;;
            *-musl)
              # musl cdylib needs a dynamic crt; cargo-zigbuild handles the
              # aarch64 linker flag too.
              RUSTFLAGS="-C target-feature=-crt-static" \
                cargo zigbuild --release --target ${{ matrix.target }} -p spatial-rules-node
              ;;
            *)
              cargo build --release --target ${{ matrix.target }} -p spatial-rules-node
              ;;
          esac
          # Stage the cdylib as the platform package's .node. Cargo writes to
          # the workspace-root target dir (../target), and napi build does NOT
          # drop the binary into npm/<platform>/ on its own.
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            ARTIFACT=spatial_rules_node.dll
          else
            ARTIFACT=libspatial_rules_node.so
          fi
          mkdir -p "npm/${{ matrix.platform }}"
          cp "../target/${{ matrix.target }}/release/$ARTIFACT" \
            "npm/${{ matrix.platform }}/spatial-rules.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: node/npm/${{ matrix.platform }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev dependencies
        # Needed so the root package's prepack (tsc emit to dist/) works during
        # npm publish.
        working-directory: node
        run: npm install
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Restore platform binaries
        run: |
          for dir in artifacts/*/; do
            platform="$(basename "$dir")"
            mkdir -p "node/npm/$platform"
            cp "$dir"/*.node "node/npm/$platform/"
          done
      - name: Publish platform packages
        working-directory: node
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for dir in npm/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "skip $name@$VERSION (already published)"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        working-directory: node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Wasm package (npm spatial-rules-wasm): wasm-pack build + tsc emit run
      # from the `prepack` hook, so this only needs the wasm32 toolchain and
      # devDependencies on PATH.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - name: Install wasm dev dependencies
        working-directory: wasm
        run: npm install
      - name: Publish wasm package
        working-directory: wasm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Python package (PyPI spatial-rules): maturin builds the abi3 wheel and
      # uploads it. Uses the PYPI_TOKEN secret (username `__token__`).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: publish
          args: --release --skip-existing
          working-directory: python
